<!DOCTYPE html>
<html lang="ko">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>투입 이력 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- Auth overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand">WFM</div>
    <div class="auth-title">투입 이력 현황</div>
    <div class="auth-subtitle">비밀번호를 입력하세요</div>
    <input type="password" id="authInput" class="auth-input" placeholder="••••••••" autocomplete="current-password">
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="authBtn">입장</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header id="header">
    <div class="hd-brand">
      <span class="hd-logo">WFM</span>
      <span class="hd-title">투입 이력 현황</span>
    </div>
    <div class="hd-sep"></div>
    <div class="hd-nav">
      <button class="hd-nav-btn" id="prevYear" aria-label="이전 연도">‹</button>
      <span class="hd-year" id="yearDisplay" aria-live="polite">2026</span>
      <button class="hd-nav-btn" id="nextYear" aria-label="다음 연도">›</button>
      <button class="hd-nav-btn hd-today" id="btnToday" title="오늘(현재 월)로 이동">오늘</button>
    </div>
    <div class="hd-spacer"></div>
    <div id="saveStatus" class="hd-save" aria-live="polite" data-state="idle">
      <span class="hd-save-msg" id="saveMsg"></span>
      <button type="button" class="hd-save-btn" id="btnSaveRetry" hidden>다시 시도</button>
      <button type="button" class="hd-save-btn is-revert" id="btnSaveRevert" hidden title="저장되지 않은 변경을 버리고 서버 데이터로 되돌립니다">되돌리기</button>
    </div>
    <div class="view-toggle" role="group" aria-label="화면 선택">
      <button id="btnYear" class="active" aria-pressed="true">투입 현황</button>
      <button id="btnBench" aria-pressed="false">가용인력</button>
      <button id="btnWisenm" aria-pressed="false" title="WiseN TM 공수 산정">공수 산정</button>
    </div>
    <div class="hd-sep"></div>
    <button class="hd-mgmt-btn" id="btnMgmt">⚙ 관리</button>
    <button class="hd-icon-btn" id="themeToggle" title="다크모드" aria-label="다크모드 전환">☀</button>
  </header>

  <div id="subheader" class="hidden"></div>

  <div id="filterBar" class="filter-bar hidden">
    <span class="filter-bar-label">필터</span>
    <input id="filterInput" type="text" placeholder="멤버 또는 프로젝트 검색..." class="filter-bar-input">
    <button id="filterClear" class="filter-bar-clear" style="display:none">✕ 초기화</button>
    <label class="filter-bar-check filter-bar-check--indent">
      <input type="checkbox" id="showTotalBar" checked>월별 합계
    </label>
    <label class="filter-bar-check">
      <input type="checkbox" id="showMonthBg">월별 구분색
    </label>
    <label class="filter-bar-check" title="기준 연도 앞뒤 6개월을 연하게 함께 표시 (KPI·연간 가용은 기준 연도만 집계)">
      <input type="checkbox" id="showPadMonths" checked>앞뒤 기간 보기
    </label>
    <label class="filter-bar-check" title="막대·숫자 글씨를 키움">
      <input type="checkbox" id="largeText">큰 글씨
    </label>
    <div class="filter-bar-sep"></div>
    <select id="projFilter" class="filter-bar-select">
      <option value="">프로젝트 전체</option>
    </select>
    <div class="filter-bar-sep"></div>
    <div class="assign-mode-seg" id="assignModeSeg" role="group" aria-label="공수 기준">
      <button class="amseg-btn" data-amode="plan" aria-pressed="false" title="계획 공수만 표시">계획</button>
      <button class="amseg-btn active" data-amode="actual" aria-pressed="true" title="실제 공수 표시 (실제 미입력은 계획으로 대체해 연하게 표시)">실제</button>
      <button class="amseg-btn" data-amode="both" aria-pressed="false" title="실제와 계획을 함께 표시">비교</button>
    </div>
    <label class="filter-bar-check">
      <input type="checkbox" id="showAllowanceCheck">현장수당
    </label>
    <div class="filter-bar-sep"></div>
    <div class="export-wrap" id="exportWrap">
      <button class="export-btn" id="exportBtn">↓ 내보내기</button>
      <div class="export-dropdown hidden" id="exportDropdown">
        <button class="export-item" id="exportPng">PNG 이미지</button>
        <button class="export-item" id="exportPdf">PDF 인쇄</button>
      </div>
    </div>
  </div>

  <div id="benchFilterBar" class="filter-bar hidden">
    <span class="filter-bar-label">필터</span>
    <input id="benchFilterInput" type="text" placeholder="멤버 검색..." class="filter-bar-input">
    <label class="filter-bar-check filter-bar-check--indent">
      <input type="checkbox" id="benchShowAvailOnly">선택 월에 여유 있는 멤버만
    </label>
    <div class="filter-bar-sep"></div>
    <div style="position:relative;display:flex;align-items:center">
      <button class="skill-filter-btn" id="benchSkillBtn">스킬 ▾</button>
      <div class="skill-filter-dropdown hidden" id="benchSkillDropdown"></div>
    </div>
  </div>

  <div id="kpi-wrap"></div>
  <div id="main">
    <div id="grid-wrap">
      <div id="grid-container"></div>
    </div>
  </div>
</div>

<!-- Bottom panels -->
<div id="spark-tooltip"></div>
<div id="overlay"></div>
<div class="detail-panel" id="projectPanel" role="dialog" aria-label="프로젝트 상세" tabindex="-1" inert>
  <div class="panel-inner">
    <div class="panel-handle" id="projHandle"></div>
    <button class="panel-close" id="projClose" aria-label="닫기">✕</button>
    <div id="projectPanelContent"></div>
  </div>
</div>
<div class="detail-panel" id="memberPanel" role="dialog" aria-label="멤버 상세" tabindex="-1" inert>
  <div class="panel-inner">
    <div class="panel-handle" id="memHandle"></div>
    <button class="panel-close" id="memClose" aria-label="닫기">✕</button>
    <div id="memberPanelContent"></div>
  </div>
</div>

<!-- Management drawer -->
<div class="drawer" id="mgmtDrawer" role="dialog" aria-label="관리" tabindex="-1" inert>
  <div class="drawer-header">
    <span class="drawer-title">관리</span>
    <button class="drawer-close" id="mgmtClose" aria-label="닫기">✕</button>
  </div>
  <div class="drawer-tabs">
    <button class="dtab active" data-tab="members">멤버</button>
    <button class="dtab" data-tab="projects">프로젝트</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer">
    <button class="btn-ghost-xs" id="btnReset">데이터 초기화</button>
    <span style="font-size:11px;color:var(--text-m)">변경 내용은 서버에 자동 저장됩니다</span>
  </div>
</div>
<div id="drawerOverlay" style="position:fixed;inset:0;z-index:290;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s"></div>

<!-- Form modal (member/project add·edit) -->
<div class="modal-overlay hidden" id="formModal">
  <div class="modal-card" style="max-width:580px">
    <div class="modal-header">
      <span class="modal-title" id="formTitle">멤버 추가</span>
      <button class="modal-close-btn" id="formClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div id="formContent"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger hidden" id="formDeleteBtn">삭제</button>
      <div style="flex:1"></div>
      <button class="btn-ghost" id="formCancelBtn">취소</button>
      <button class="btn-primary" id="formSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Assignment modal -->
<div class="modal-overlay hidden" id="assignModal" data-backdrop="close">
  <div class="modal-card modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="assignTitle">공수 관리</span>
      <button class="modal-close-btn" id="assignClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="assignBody"></div>
  </div>
</div>

<!-- Bulk assign modal -->
<div class="modal-overlay hidden" id="bulkModal" data-backdrop="close">
  <div class="modal-card modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="bulkTitle">일괄 공수 입력</span>
      <button class="modal-close-btn" id="bulkClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="bulkBody"></div>
    <div class="modal-footer">
      <div style="flex:1"></div>
      <button class="btn-ghost" id="bulkCancelBtn">취소</button>
      <button class="btn-primary" id="bulkSaveBtn">저장</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="wisenm.js"></script>
<script src="app.js"></script>
